# Agent GM releases -- spec sections 14.3 and 13.6.
#
# Two jobs, one script. `dry-run` runs on every push to main and builds
# EVERYTHING and publishes NOTHING; `release` runs on a `vX.Y.Z` tag and does
# the same build, signs it, and publishes. They call the same
# `scripts/release.sh` modes, which is the point: a release workflow that is
# only ever exercised on release day is a workflow that has rotted since the
# last one, and the first anybody hears of it is halfway through a release.
#
# Every step here is a `devbox run <script>` or the thin GitHub-side action a
# script cannot do for itself (checkout, cosign install, GHCR digest lookup).
# A step that shells out to something with no script is a step nobody can
# reproduce locally, and is rejected in review (section 13.6).
#
# **This workflow does not cut the tag.** The tag is the coordinator's act,
# after review and after a live gate: no release is cut from a commit that has
# not passed one (section 16).
name: release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  # So a change to this workflow, to scripts/release.sh or to npm/ can be
  # proved on the branch that makes it rather than after it lands.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release.sh"
      - "npm/**"
      - "devbox.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build the six archives, checksums.txt and the npm tarball, install the npm
  # tarball for real, and assert the section 11.2 exit codes survive the shim.
  # Publishes nothing, signs nothing, and needs no secret.
  dry-run:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # binfmt for aarch64, so that `release.sh build` EXECUTES the linux/arm64
      # binaries rather than only inspecting them. Section 16 Slice 4 test 1
      # asks for `agm version` under qemu "where the architecture allows", and
      # this is what allows it.
      - uses: docker/setup-qemu-action@v3

      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"

      - run: devbox run release-dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.tgz
            dist/checksums.txt
          retention-days: 7
          if-no-files-found: error

  # A `v*` tag reaches this job; only a `vMAJOR.MINOR.PATCH` tag gets past its
  # first step. The `if:` cannot express the pattern (GitHub Actions has no
  # regex), so the shape is asserted twice: here as far as `v*` goes, and
  # strictly in `scripts/release.sh`'s require_tag, which is what actually
  # refuses. R-1.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      packages: read # read back the GHCR digest the ci workflow pushed
      id-token: write # cosign keyless, and npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
      - uses: sigstore/cosign-installer@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The digest of the image the `ci` workflow pushed for this same tag.
      # A release note records the digest because deployments pin by digest
      # and not by tag (section 14.2).
      #
      # This step only FINDS the digest. Whether it is usable -- a real
      # `sha256:`, resolvable on the registry, and built from this very commit
      # -- is `release.sh publish`'s own `require_digest` (R-2, R-6), because
      # that is the script the note comes from, and a judgement that lives
      # only in a YAML step is a judgement `devbox run release` does not have.
      # R-1, R-5. Three questions, asked before anything is built, because
      # every step after this one leaves a permanent public trace: a sigstore
      # entry, a GitHub release, an npm version.
      #
      #   1. Is the tag a version? `v*` fires this workflow, so `vtest` and
      #      `vnonsense` get here. release.sh refuses them too; this refuses
      #      them before the six-minute build.
      #   2. Is the tagged commit ON main? Section 16 makes the tag the
      #      coordinator's act on a reviewed commit; nothing stopped a tag on
      #      a branch, or on a commit that was never merged.
      #   3. Did that commit's `ci` run pass? Section 14.3 says no release is
      #      cut from a commit that has not passed a live gate, and a red `ci`
      #      is a commit that has not passed anything. `release.yml` is a
      #      separate workflow with no `needs:` on `ci.yml`, so this is the
      #      only place the two can be tied together.
      - name: The tag is a version, on main, and green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${GITHUB_REF_NAME}' is not vMAJOR.MINOR.PATCH with an optional" \
                 "prerelease. A tag that is not a version would cut a real, signed, public" \
                 "release that cannot be withdrawn from the sigstore transparency log." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main. A release is cut" \
                 "from a reviewed commit on main (spec section 16); this tag names a commit" \
                 "that is not on it. Merge first, then tag the merged commit." >&2
            exit 1
          fi

          # Has ANY `ci` push run for this exact commit concluded `success`?
          #
          # Not "what did the newest one conclude" -- that question cannot be
          # answered yes. `ci.yml` also fires on `tags: ["v*"]`, so pushing
          # v1.0.0 starts a SECOND ci push run for this same head_sha, and
          # that run is still in progress while this step asks. Taking the
          # last run by start time therefore reads the tag's own run, gets
          # `null`, and refuses every release including a perfectly green one.
          # It failed closed, so nothing unsafe would have shipped -- but
          # nothing at all would have shipped either, and the first anybody
          # would have heard of it is halfway through cutting v1.0.0. R-9.
          #
          # The honest question is the one above: the merge-base check has
          # already proved the commit is on main, so "some push run of ci for
          # this exact sha went green" is what "this commit has passed" means.
          green="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[]
                   | select(.name == "ci" and .event == "push" and .conclusion == "success")]
                  | length')"
          if [ "${green:-0}" -lt 1 ]; then
            echo "::error::no ci push run for ${GITHUB_SHA} has concluded 'success'." \
                 "Section 14.3: no release is cut from a commit that has not passed." \
                 "If ci is still running on the merge commit, wait for it and re-run this job." >&2
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '.workflow_runs[] | "\(.name)\t\(.event)\t\(.status)\t\(.conclusion // "-")"' >&2 || true
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} is a version, ${GITHUB_SHA} is on main, and its ci run is green"

      - name: The GHCR digest for this tag
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=ghcr.io/thisnick/agent-gm
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in $(seq 1 60); do
            digest="$(docker buildx imagetools inspect "$image:${GITHUB_REF_NAME}" \
              --format '{{println .Manifest.Digest}}' 2>/dev/null | head -1 || true)"
            [ -n "$digest" ] && break
            echo "waiting for $image:${GITHUB_REF_NAME} to appear (attempt $i)"
            sleep 20
          done
          if [ -z "${digest:-}" ]; then
            echo "the image for ${GITHUB_REF_NAME} never appeared on GHCR; the ci workflow's image job must finish first" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest is $digest"

      # The same build the dry run does, plus the npm install check, so the
      # thing being published is the thing that was proved.
      - run: devbox run -- ./scripts/release.sh build
      - run: devbox run -- ./scripts/release.sh npm-check

      - run: devbox run -- ./scripts/release.sh sign

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_GM_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: devbox run -- ./scripts/release.sh publish

      # NODE_AUTH_TOKEN is temporary. npm's trusted publishing (OIDC) has to
      # be configured against a package that already exists, so the FIRST
      # release uses the token; after it, the owner enables trusted publishing
      # for this repository and this workflow, deletes the NPM_TOKEN secret,
      # and this env block loses NODE_AUTH_TOKEN. The job already has
      # `id-token: write` for cosign, which is the permission OIDC publishing
      # wants. docs/operations.md carries the three steps.
      - name: Publish @agent-gm/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: devbox run -- ./scripts/release.sh npm-publish
