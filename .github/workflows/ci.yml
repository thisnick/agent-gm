# Agent GM CI -- spec section 13.6.
#
# Every job in this file is a `devbox run <script>`. A CI step that shells out
# to something with no script is a step nobody can reproduce locally, and is
# rejected in review. The live gates of spec section 13.3 are NOT here: they
# are run by the coordinator, by hand, against a real phone.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # A tag pushed by `version.yml` with the workflow's GITHUB_TOKEN does not
  # start this workflow -- GitHub refuses to let automation trigger automation
  # -- so `version.yml` dispatches it explicitly against the tag's ref. The
  # image job is the reason: `release.yml` waits for the GHCR image whose
  # revision label is the tagged commit, and this is the workflow that builds
  # it. A dispatch against a tag ref is the same run a human's `git push
  # origin v1.2.3` would have started, with the same `github.ref`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # devbox run check is what a reviewer runs, so it is the aggregate: build,
  # vet, golangci-lint run, go test -race, and no-real-numbers.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
      - run: devbox run check

  # The four platforms of spec section 13.6 must at least COMPILE, tests
  # included. `devbox run check` covers this too; it is its own job so that a
  # cross-platform break is legible in the run summary rather than buried in
  # the aggregate.
  #
  # It exists because a symbol declared in a `//go:build !windows` file and
  # used from an unconstrained test compiled fine on Linux and not at all on
  # Windows, and would first have surfaced in Slice 4's build matrix, on a
  # slice with nothing to do with it.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
      - run: devbox run vet

  # The pin is a fact recorded in three places that must agree.
  pin-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
      - run: devbox run pin-consistency

  # The twenty-one assertions of spec section 13.4, against a fresh clone of the
  # pinned upstream tree -- not against Agent GM's own code.
  fixture-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
      - run: devbox run fixture-validation

  # Nothing in the tree looks like a real phone number. This repository is
  # public, and a commit that trips this check is reverted, not amended.
  no-real-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
      - run: devbox run no-real-numbers

  # The owner's deployment hostname is configuration, not a constant. It may
  # appear in the spec's deployment and decision sections and in
  # docs/deploy.md, labelled as the owner's deployment, and nowhere else: a
  # built-in hostname is right for one person and silently wrong for everyone,
  # and in a public repository it is also an address written where nobody put
  # it. Also inside `devbox run check`.
  no-deployment-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
      - run: devbox run no-deployment-host

  # The MCP conformance run of spec section 8.4, against the baseline in both
  # directions. The token is minted through the WHOLE OAuth flow -- admin
  # bootstrap, enrollment code, DCR, the authorization screen, owner approval,
  # the token endpoint -- because a green run over an admin bootstrap token
  # would leave the client-shaped path unmeasured. A revision that runs zero
  # scenarios fails the job rather than passing it silently.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
      - run: devbox run conformance

  # The name lint of spec section 13.5: the Matrix vocabulary, asserted as a
  # live contract over the catalogue the server actually serves and every page
  # under docs/. It is also inside `devbox run check`, because it is cheap and
  # it guards a contract a test suite cannot see.
  lint-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
      - run: devbox run lint-names

  # Spec section 15.2, performed rather than described. A backup nobody has
  # restored is a file, not a backup -- and the restore path is the one path
  # in the system that is only ever exercised on the worst day of the year,
  # so it is exercised on every push instead. It also asserts the documented
  # FAILURE mode: with the wrong data key the accounts come back signed_out
  # and the history is intact, and the server still serves.
  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
      - run: devbox run restore-drill

  # The container image of spec sections 14.1 and 14.2. It builds for
  # linux/amd64 AND linux/arm64 on every run, and pushes to GHCR on a push to
  # `main` (tagged `sha-<short>` and `main`) and on a `vX.Y.Z` tag (tagged
  # `vX.Y.Z`, `vX.Y` and `latest`). A pull request builds and does not push:
  # nothing outside this repository may name a commit that is not on main.
  #
  # Deployments pin by DIGEST, not by tag (section 14.2). The push step prints
  # the digest; a release note records it alongside the libgm commit.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"

      # Acceptance test 26 and 28, on the architecture this runner can
      # execute: the image runs as nonroot, it has no shell and no curl, and
      # `agent-gm healthcheck` exits 0 inside it against a server that reports
      # the commit that was built. It runs BEFORE the push, so a broken image
      # is never published.
      - run: devbox run image-smoke

      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: devbox run image
        env:
          # Only main or a version tag publishes. Everywhere else
          # scripts/image.sh builds both architectures and stops. A
          # workflow_dispatch counts, because that is how the tag `version.yml`
          # pushed gets its image at all -- and `image.sh push` refuses any ref
          # that is neither main nor a `vX.Y.Z` tag, so the widened condition
          # cannot publish from a branch.
          AGENT_GM_IMAGE_PUSH: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) && '1' || '0' }}

  # Decision D39: a pull request that changes what Agent GM ships carries a
  # changeset, because the version of the image, of both binaries and of
  # `@agent-gm/cli` comes from `npm/package.json` and a changeset is the only
  # thing that moves it. A documentation-only pull request needs none, and the
  # `no-release` label is the deliberate exception.
  #
  # The judgement is `scripts/changeset-check.sh` and not this file: it takes
  # the changed paths and the labels as plain input, so a contributor can ask
  # it the same question on their own branch, and so it can be tested
  # (`internal/release/changeset_check_test.go`) rather than believed. It
  # needs bash and git and nothing else, which is why this one step does not
  # pay for a devbox install.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A pull request that ships something carries a changeset
        env:
          AGENT_GM_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$base" "${{ github.event.pull_request.head.sha }}" \
            | ./scripts/changeset-check.sh
